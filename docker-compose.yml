# Local Postgres for Puniemu. Start with: docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: puniemu
      POSTGRES_PASSWORD: puniemu
      POSTGRES_DB: puniemu
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - puniemu-db:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  puniemu-db:
