# Homelab deployment for Wibble Wobble. See homelab/README.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: puniemu
      POSTGRES_USER: puni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./Database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puni -d puniemu"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PostgresConnectionString: Host=db;Database=puniemu;Username=puni;Password=${POSTGRES_PASSWORD}
      IsWibWob: "true"
      GameVersion: ${GAME_VERSION:-4.0.6}
      ServerName: ${SERVER_NAME:-puniemu}
      DataDownloadURL: https://${PUNI_DOMAIN:?set in .env}/dataDownload/
      MaxConnections: "100"
      MaxCachedAccounts: "200"
      # Changed accounts are saved to Postgres this often (seconds).
      SaveIntervalSeconds: ${SAVE_INTERVAL_SECONDS:-10}
      EmailForAuthMessages: ${EMAIL_FOR_AUTH:-}
      AppPasswordForAuthMessages: ${EMAIL_APP_PASSWORD:-}
    volumes:
      - ./dataDownload:/app/dataDownload:ro
    # Unsaved changes are also written on a normal stop/restart; give it time.
    stop_grace_period: 30s
    restart: unless-stopped

  caddy:
    build: ./homelab/caddy
    depends_on: [server]
    environment:
      PUNI_DOMAIN: ${PUNI_DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN:?set in .env}
    ports:
      - "443:443"
    volumes:
      - ./homelab/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
